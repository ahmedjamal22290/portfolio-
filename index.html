<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Basic -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/Photo.jpg" />
  <!-- preload Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    onload="this.onload=null;this.rel='stylesheet'"
  >

  <noscript>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    >
  </noscript>
  
  <!-- SEO Utama -->
  <title>Ahmed Jamal | Flutter Developer</title>
  <meta name="description" content="Official portfolio of Ahmed Jamal, Flutter Developer. Building cross-platform mobile apps for Android and iOS with clean architecture and delightful UX." />
  <meta name="keywords" content="Ahmed Jamal, Flutter Developer, Flutter, Dart, Mobile App Developer, Cross-Platform, Portfolio" />
  <meta name="author" content="Ahmed Jamal" />

  <!-- Google Search Console -->


  <!-- Theme / PWA -->
  <meta name="theme-color" content="#030014" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://github.com/ahmedjamal22290" />
  <meta property="og:title" content="Ahmed Jamal | Flutter Developer" />
  <meta property="og:description" content="Official portfolio of Ahmed Jamal, Flutter Developer." />
  <meta property="og:image" content="/Meta.png" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://github.com/ahmedjamal22290" />
  <meta name="twitter:title" content="Ahmed Jamal | Flutter Developer" />
  <meta name="twitter:description" content="Official portfolio of Ahmed Jamal, Flutter Developer." />
  <meta name="twitter:image" content="/Meta.png" />

  <!-- Canonical -->
  <link rel="canonical" href="https://github.com/ahmedjamal22290" />

  <!-- Structured Data: Person -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Ahmed Jamal",
    "url": "https://github.com/ahmedjamal22290",
    "image": "/Photo.jpg",
    "jobTitle": "Flutter Developer",
    "description": "Flutter Developer with 1 year of production experience building cross-platform mobile apps for Android and iOS.",
    "sameAs": [
      "https://www.linkedin.com/in/ahmedbenjamal",
      "https://github.com/ahmedjamal22290"
    ]
  }
  </script>
</head>

<body>
  <!-- Konten teks penting untuk SEO -->
  <header style="display:none">
    <h1>Ahmed Jamal</h1>
    <p>
      Flutter Developer building cross-platform mobile applications for Android and iOS.
    </p>
  </header>

  <!-- Root React -->
  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
